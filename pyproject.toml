[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dark-chat"
version = "3.0.1"
description = "Minimal encrypted terminal chat with private offline mailboxes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=44,<50",
  "websockets>=15,<18",
  "prompt-toolkit>=3.0.48,<4",
  "PyNaCl>=1.6.2,<2",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Topic :: Communications :: Chat",
]

[project.scripts]
dark-chat = "dark_terminal_chat.client:main"
dark-chat-server = "dark_terminal_chat.server:main"

[project.urls]
Repository = "https://github.com/iZubayr/dark-terminal-chat"
Issues = "https://github.com/iZubayr/dark-terminal-chat/issues"

[tool.setuptools.packages.find]
where = ["src"]
